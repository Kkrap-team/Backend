<!DOCTYPE html>
<html>
<head>
    <title>Chat Application</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <script>
        let stompClient = null;

        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function (frame) {
                console.log('Connected: ' + frame);
                stompClient.subscribe('/topic/public', function (message) {
                    showMessage(JSON.parse(message.body));
                });
            });
        }

        function sendMessage() {
            const sender = document.getElementById('sender').value;
            const content = document.getElementById('message').value;
            const chatRoomId = document.getElementById('chatRoomId').value;

            stompClient.send("/app/chat.sendMessage", {}, JSON.stringify({
                sender: sender,
                content: content,
                chatRoomId: chatRoomId
            }));
        }

        function showMessage(message) {
            const chat = document.getElementById('chat');
            const messageElement = document.createElement('div');
            messageElement.innerHTML = `<strong>${message.sender}:</strong> ${message.content}`;
            chat.appendChild(messageElement);
        }
    </script>
</head>
<body onload="connect()">
<div>
    <input id="sender" type="text" placeholder="Your Name" />
    <input id="chatRoomId" type="text" placeholder="Chat Room ID" />
    <input id="message" type="text" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
</div>
<div id="chat" style="margin-top: 20px; border: 1px solid black; padding: 10px; width: 400px; height: 300px; overflow-y: scroll;">
</div>
</body>
</html>
